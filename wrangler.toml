name = "llmasaserver"
pages_build_output_dir = "public"
compatibility_date = "2026-08-22"

[vars]
# Defaults used when an LLM_PROVIDERS entry names no model of its own.
GROQ_MODEL = "openai/gpt-oss-120b"
# OpenRouter's auto-router across its free model pool. Only free ids are
# accepted; the client refuses to construct with a paid model.
OPENROUTER_MODEL = "openrouter/free"
GEMINI_MODEL = "gemini-3.1-flash-lite"
# Priority order, measured rather than assumed.
#
# Rate-limit buckets are per-model, not per-account: one Groq model returning
# 429 while a sibling reports its budget untouched. So every model that passes
# the real contract is another full 8,000 tokens/minute, and listing four of
# them multiplies the Groq allowance before Gemini is ever reached. Ordered by
# page quality, since the first one that answers is the one that serves.
#
# Every entry here was tested against the real contract, not a toy schema.
# Excluded for cause: groq compound and compound-mini reject json_schema
# outright, orpheus is speech, allam caps completions below a page, and the
# gemini flash-lite-latest and 3-flash-preview variants return next_state as an
# object rather than a string.
LLM_PROVIDERS = "groq:openai/gpt-oss-120b,groq:qwen/qwen3.8-27b,groq:openai/gpt-oss-20b,groq:qwen/qwen3.6-27b,gemini:gemini-3.1-flash-lite,gemini:gemini-3.1-flash-lite-preview,openrouter"

# Opaque per-session JSON state + generic runtime metadata.
# This binding knows nothing about the website's application concepts.
[[d1_databases]]
binding = "STATE_DB"
database_name = "llm_as_a_server_state"
database_id = "4b7bc8d7-b55d-4b1e-a344-472af8282692"

# Exceptional per-session virtual filesystem. Private bucket, server-side only.
# The ordinary request path never touches this binding.
[[r2_buckets]]
binding = "VFS_BUCKET"
bucket_name = "llm-as-a-server-vfs"
