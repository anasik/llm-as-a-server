name: verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run should not race an in-flight one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: tests and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The dependency tree needs legacy resolution: vitest-pool-workers pins
      # its own wrangler, which npm's strict peer resolver refuses to reconcile.
      - run: npm ci --legacy-peer-deps

      - name: typecheck the deterministic layer
        run: npm run typecheck

      - name: tests, sanitizer and architecture audit
        run: npm run test:ci

      # The compiled prefix must match CONTRACT.md and SITE.md, or the deployed site
      # would run on a different contract than the repo describes.
      - name: constitution is in sync
        run: |
          npm run constitution
          git diff --exit-code src/kernel/constitution.generated.ts

  deploy:
    name: deploy to pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://llmasaserver.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: build constitution
        run: npm run constitution

      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy --project-name llmasaserver --branch main --commit-dirty=true

      # Provider keys live only as Cloudflare secrets, never in this repo or in
      # GitHub Actions. This only checks the deployment came up.
      - name: verify the deployment answers
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://llmasaserver.pages.dev/__harness/health > /tmp/health.json; then
              cat /tmp/health.json
              node -e "
                const h = require('/tmp/health.json');
                if (!h.ok) { console.error('health reports not ok'); process.exit(1); }
                console.log('state_store:', h.state_store, '| provider_secret:', h.provider_secret);
              "
              exit 0
            fi
            echo "health check attempt $attempt failed; retrying"
            sleep 10
          done
          echo "deployment did not become healthy"
          exit 1
